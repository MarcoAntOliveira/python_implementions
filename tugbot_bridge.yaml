# ros_gz_bridge config para o Tugbot (world_demo)
# Uso:
#   ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=tugbot_bridge.yaml
# Obs: use_sim_time:=true nos demais nós do ROS 2.

# ---------- Tempo ----------
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ---------- Controle ----------
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/tugbot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/tugbot/enable"
  gz_topic_name: "/model/tugbot/enable"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "gz.msgs.Boolean"
  direction: ROS_TO_GZ

- ros_topic_name: "/tugbot/gripper_hand_joint/cmd_vel"
  gz_topic_name: "/model/tugbot/joint/gripper_hand_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/tugbot/gripper_joint/cmd_vel"
  gz_topic_name: "/model/tugbot/joint/gripper_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/tugbot/warning_light_joint/cmd_vel"
  gz_topic_name: "/model/tugbot/joint/warnign_light_joint/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# ---------- Odometria / TF / Pose ----------
- ros_topic_name: "/odom"
  gz_topic_name: "/model/tugbot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/model/tugbot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Ground truth do robo (nao publicar em /tf para nao conflitar com a odometria)
- ros_topic_name: "/tugbot/pose"
  gz_topic_name: "/model/tugbot/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/tugbot/joint_states"
  gz_topic_name: "/world/world_demo/model/tugbot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

